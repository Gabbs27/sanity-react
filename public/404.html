<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found - 404 | Gabriel Abreu</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    main { text-align: center; padding: 2rem; }
    p.code { font-size: 3.5rem; font-weight: 700; opacity: .6; margin: 0 0 .5rem; }
    a { color: #6366f1; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } }
  </style>
</head>
<body>
  <!-- What Vercel serves for anything the rewrite in vercel.json does not
       answer, mostly a missing /assets/ file, with a real 404 status. It used
       to be the GitHub Pages SPA shim, which bounced every 404 to the home
       page; GitHub Pages has been gone since August 2026. -->
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>Página no encontrada</p>
    <p><a href="/">Back home</a> · <a href="/allpost">Read latest posts</a></p>
  </main>
</body>
</html>
