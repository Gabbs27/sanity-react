<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect x="0" y="0" width="10" height="630" fill="#6366F1"/>

  <!-- Un check en verde, y detrás el hueco que el check no mira: la caja
       vacía de 303px con su etiqueta. El check está satisfecho igual. -->
  <g transform="translate(800,150)">
    <!-- el contenedor vacío -->
    <rect x="0" y="0" width="300" height="230" rx="10"
          fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="150" y="126" text-anchor="middle"
          font-family="Helvetica,Arial,sans-serif" font-size="19"
          letter-spacing="3" fill="#475569">ADVERTISEMENT</text>
    <text x="0" y="278" font-family="Menlo,Monaco,monospace" font-size="20" fill="#475569">303px</text>

    <!-- el check, verde y encima -->
    <circle cx="246" cy="-6" r="44" fill="#22C55E"/>
    <path d="M226 -6 l14 15 l26 -30" fill="none" stroke="#0F172A"
          stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#38BDF8">VERIFICATION</text>
  <text x="72" y="272" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="700" fill="#F8FAFC">Green</text>
  <text x="72" y="364" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="700" fill="#F8FAFC">and</text>
  <text x="72" y="456" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="700" fill="#22C55E">blind</text>
  <text x="72" y="548" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#64748B">codewithgabo.com</text>
</svg>
